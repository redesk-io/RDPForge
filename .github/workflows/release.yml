name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: zig build -Doptimize=ReleaseSafe --summary all
      - run: |
          set -euxo pipefail
          ls -R zig-out/bin
          cd zig-out/bin
          for d in *-windows-gnu; do
            (cd "$d" && zip -r "$GITHUB_WORKSPACE/RDPForge-$d.zip" ForgeHook.dll InstallerCli.exe)
          done
          cd "$GITHUB_WORKSPACE"
          ls -la RDPForge-*.zip
          test $(ls RDPForge-*.zip | wc -l) -eq 3
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: RDPForge-*.zip
          if-no-files-found: error

  gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - run: msbuild -t:restore src/ManagerGui/ManagerGui.csproj
      - run: msbuild src/ManagerGui/ManagerGui.csproj -p:Configuration=Release
      - run: Compress-Archive -Path src/ManagerGui/bin/Release/net472/ManagerGui.exe -DestinationPath ManagerGui.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-gui
          path: ManagerGui.zip
          if-no-files-found: error

  publish:
    needs: [binaries, gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -R dist
      - run: |
          set -euxo pipefail
          ls dist/
          test $(ls dist/*.zip | wc -l) -eq 4
      - if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "${GITHUB_REF#refs/tags/}" dist/* --title "${GITHUB_REF#refs/tags/}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
